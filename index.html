<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zyklus</title>
  <meta name="description" content="Einfacher, kostenloser Periodenkalender mit Partner-Freigabe.">
  <meta name="theme-color" content="#fbf7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17131a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zyklus">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Gewähltes Design sofort setzen, damit beim Start nichts aufblitzt
    try {
      var zp = (JSON.parse(localStorage.getItem("zyklus.v1")) || {}).prefs || {};
      if (zp.theme === "light" || zp.theme === "dark") document.documentElement.dataset.theme = zp.theme;
      if (zp.festive !== false) document.documentElement.dataset.festive = "1";
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="symptoms.js"></script>
  <script src="app.js"></script>
</body>
</html>
